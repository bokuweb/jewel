[package]
name = "jewel_spacy"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python-free spaCy model runtime for Japanese and English entity extraction"
repository = "https://github.com/bokuweb/jewel"
readme = "README.md"
keywords = ["spacy", "nlp", "ner", "japanese", "inference"]
categories = ["text-processing"]

[dependencies]
fancy-regex = "0.16"
flate2 = "1.1"
rmp-serde = "1.3"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f" }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
