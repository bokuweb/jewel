[workspace]
members = [
    ".",
    "crates/jewel-ginza",
    "crates/jewel-transformers",
]
resolver = "2"

[workspace.package]
version = "0.0.5"
edition = "2021"
repository = "https://github.com/bokuweb/jewel"
publish = false

[workspace.dependencies]
thiserror = "2"

[package]
name = "jewel-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Python-free spaCy model runtime for Japanese and English entity extraction"
repository.workspace = true
readme = "README.md"
keywords = ["spacy", "nlp", "ner", "japanese", "inference"]
categories = ["text-processing"]

[features]
default = ["delarocha-tokenizer"]
delarocha-tokenizer = ["dep:delarocha"]
sudachi-tokenizer = ["dep:sudachi"]

[dependencies]
delarocha = { git = "https://github.com/bokuweb/delarocha.git", rev = "2f2b6cff98fcc9c6543d8663e4fcd8de645b9c23", features = ["vibrato-system"], optional = true }
fancy-regex = "0.16"
flate2 = "1.1"
rmp-serde = "1.3"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f", optional = true }
thiserror.workspace = true
unicode_categories = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
base64 = "0.22"
