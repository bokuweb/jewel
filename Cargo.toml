[package]
name = "jewel"
version = "0.0.4"
edition = "2021"
publish = false
description = "Python-free spaCy model runtime for Japanese and English entity extraction"
repository = "https://github.com/bokuweb/jewel"
readme = "README.md"
keywords = ["spacy", "nlp", "ner", "japanese", "inference"]
categories = ["text-processing"]

[features]
default = ["delarocha-tokenizer"]
delarocha-tokenizer = ["dep:delarocha"]
sudachi-tokenizer = ["dep:sudachi"]

[dependencies]
delarocha = { git = "https://github.com/bokuweb/delarocha.git", tag = "0.0.15", features = ["vibrato-system"], optional = true }
fancy-regex = "0.16"
flate2 = "1.1"
rmp-serde = "1.3"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f", optional = true }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
