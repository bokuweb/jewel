name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --no-default-features
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo check --all-targets --no-default-features --features sudachi-tokenizer
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: >-
          python -m py_compile
          tools/export_profile.py
          tools/export_spacy_model.py
          tools/generate_entity_ruler_fixture.py
          tools/generate_entity_ruler_token_fixture.py
          tools/check_ner_compatibility.py
          tools/validate_bundle_runtime.py
      - run: python -m unittest discover -s tests -p "test_*.py"
