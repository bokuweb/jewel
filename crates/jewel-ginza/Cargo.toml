[package]
name = "jewel-ginza"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GiNZA model adapter and entity label mapping for Jewel"
repository.workspace = true

[features]
default = []
transformers = ["dep:jewel-transformers"]

[dependencies]
jewel-core = { path = "../..", default-features = false, features = ["sudachi-tokenizer"] }
jewel-transformers = { path = "../jewel-transformers", optional = true }
thiserror.workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "electra_parity"
required-features = ["transformers"]

[[example]]
name = "electra_vectors"
required-features = ["transformers"]

[[example]]
name = "extract_electra"
required-features = ["transformers"]

[[example]]
name = "inspect_transformer_bundle"
required-features = ["transformers"]
