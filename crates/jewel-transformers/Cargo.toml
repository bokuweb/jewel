[package]
name = "jewel-transformers"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Transformer encoder boundary for Jewel NLP runtimes"
repository.workspace = true

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
jewel-core = { path = "../..", default-features = false, features = ["sudachi-tokenizer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f" }
thiserror.workspace = true
